name: Bootstrap dependency lockfiles (one-time)
on:
  push:
    branches: [feat/foundation-v0]
    paths:
      - .github/workflows/bootstrap-lockfiles.yml
permissions:
  contents: write
concurrency:
  group: uf-css-bootstrap-lockfiles
  cancel-in-progress: false
jobs:
  create-lockfiles:
    if: github.repository == 'kingbattash/Universal-Foundation-CSS' && github.ref_name == 'feat/foundation-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/foundation-v0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact dependency trees without executing package scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix integration/web --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix integration/expo --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit locks to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json integration/web/package-lock.json integration/expo/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles were already current."
          else
            git commit -m "build: lock root and integration fixture dependencies"
            git push origin HEAD:feat/foundation-v0
          fi
