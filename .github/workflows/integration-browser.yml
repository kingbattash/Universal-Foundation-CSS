name: Verify browser accessibility and visual quality
on:
  push:
    branches: [main, feat/foundation-v0]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test libraries
        run: npm install --prefix integration/browser --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Generate a reproducible dependency lock for review
        run: |
          npm install --prefix integration/browser --package-lock-only --ignore-scripts --no-audit --no-fund
          echo UF_BROWSER_LOCK_BEGIN
          cat integration/browser/package-lock.json
          echo UF_BROWSER_LOCK_END
      - name: Install Chromium with browser dependencies
        run: ./integration/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate both independent theme fixtures
        run: |
          node scripts/generate-project-theme.mjs --config examples/project-theme/editorial.v2.json --out generated/editorial
          node scripts/generate-project-theme.mjs --config examples/project-theme/operations.v2.json --out generated/operations
      - name: Verify browser quality assertions and collect screenshots
        working-directory: integration/browser
        run: npm test
      - name: Upload screenshots, HTML report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uf-css-browser-quality
          path: |
            integration/browser/playwright-report
            integration/browser/test-results
          if-no-files-found: warn
          retention-days: 14
