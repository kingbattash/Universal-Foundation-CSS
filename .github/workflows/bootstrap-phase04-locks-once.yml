name: One-time locked Next.js and Expo dependency bootstrap
on:
  push:
    branches: [feat/foundation-v0]
    paths:
      - .github/workflows/bootstrap-phase04-locks-once.yml
permissions:
  contents: write
concurrency:
  group: uf-css-phase04-locks
  cancel-in-progress: false
jobs:
  locked-fixtures:
    if: github.repository == 'kingbattash/Universal-Foundation-CSS' && github.ref_name == 'feat/foundation-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/foundation-v0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve lockfiles without installing or executing scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix integration/nextjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix integration/expo
      - name: Commit both lockfiles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/nextjs/package-lock.json integration/expo/package-lock.json
          if git diff --cached --quiet; then
            echo "Both lockfiles were already committed."
          else
            git commit -m "build(integration): lock Next.js StyleX and Expo safe-area dependencies"
            git push origin HEAD:feat/foundation-v0
          fi
